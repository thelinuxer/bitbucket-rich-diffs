name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Build per-browser packages
        run: scripts/build.sh --version "${GITHUB_REF_NAME#v}" --zip

      - name: Lint Firefox build (web-ext)
        run: npx --yes web-ext@8 lint --source-dir=dist/firefox --warnings-as-errors=false

      - name: Submit Firefox build to AMO
        continue-on-error: true
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npx --yes web-ext@8 sign \
            --source-dir=dist/firefox \
            --channel=listed \
            --artifacts-dir=dist \
            --amo-metadata=amo-metadata.json \
            --approval-timeout=0

      - name: Submit Chrome build to Chrome Web Store
        continue-on-error: true
        env:
          CWS_ENABLED: ${{ vars.CWS_ENABLED || secrets.CWS_ENABLED }}
          CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
          CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
          CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
          CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
          CWS_PUBLISH_TARGET: ${{ vars.CWS_PUBLISH_TARGET || 'default' }}
        run: |
          if [ "$CWS_ENABLED" != "true" ]; then
            echo "Chrome Web Store publishing is gated. Set CWS_ENABLED=true (repo variable or secret) to enable. Skipping."
            exit 0
          fi
          if [ -z "$CWS_REFRESH_TOKEN" ] || [ -z "$CWS_EXTENSION_ID" ]; then
            echo "Chrome Web Store credentials not configured (CWS_REFRESH_TOKEN / CWS_EXTENSION_ID); skipping."
            exit 0
          fi
          ZIP="dist/bitbucket-rich-diffs-chrome-v${GITHUB_REF_NAME#v}.zip"
          ACCESS_TOKEN=$(curl -fsS https://oauth2.googleapis.com/token \
            -d "client_id=$CWS_CLIENT_ID" \
            -d "client_secret=$CWS_CLIENT_SECRET" \
            -d "refresh_token=$CWS_REFRESH_TOKEN" \
            -d "grant_type=refresh_token" \
            | jq -r .access_token)
          if [ -z "$ACCESS_TOKEN" ] || [ "$ACCESS_TOKEN" = "null" ]; then
            echo "::error::Failed to obtain CWS access token"
            exit 1
          fi
          echo "Uploading $ZIP to Chrome Web Store..."
          curl -fsS -X PUT \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "x-goog-api-version: 2" \
            -T "$ZIP" \
            "https://www.googleapis.com/upload/chromewebstore/v1.1/items/$CWS_EXTENSION_ID"
          echo "Publishing $CWS_EXTENSION_ID (target=$CWS_PUBLISH_TARGET)..."
          curl -fsS -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "x-goog-api-version: 2" \
            -H "Content-Length: 0" \
            "https://www.googleapis.com/chromewebstore/v1.1/items/$CWS_EXTENSION_ID/publish?publishTarget=$CWS_PUBLISH_TARGET"

      - name: Create GitHub release
        if: always()
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: false
